# ============================================================================
# Alembic 配置
# 注意：这里**故意不写** sqlalchemy.url。连接串由 alembic/env.py 从
# app.core.config 读取，这样密码只有 .env 一处来源，不会被提交进版本库。
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
# 迁移文件名带上时间戳与描述，按目录列出来就是一份可读的变更史
# 形如：20260913_1430_a1b2c3d4_create_documents_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# 迁移文件名里允许出现中文
truncate_slug_length = 60
timezone = UTC

[post_write_hooks]

# ---------------------------- 日志 ----------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
