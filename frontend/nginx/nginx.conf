# ============================================================================
# 前端 nginx 配置：托管静态资源 + 反向代理后端接口
#
# 这个文件里有三处配置直接决定功能是否可用，删任何一条都会出问题：
#   1. SSE 反代的 proxy_buffering off（见 /api/ 段）
#   2. SPA fallback 的 try_files（见 / 段）
#   3. index.html 的禁用缓存（见 /index.html 段）
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 MAX_UPLOAD_SIZE_MB 保持一致（20 MB）再留一点余量。
    # 这一层会在请求体还没读完时就拒绝，比让应用去处理更省资源。
    client_max_body_size 25m;

    # 隐藏 nginx 版本号，减少被针对性扫描的信息
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # ------------------------------------------------------------------
    # 容器健康检查端点。不写访问日志，避免探针把日志刷满。
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # 接口反向代理
    # ------------------------------------------------------------------
    location /api/ {
        # 用服务名而不是 localhost：容器里的 localhost 指向容器自身
        proxy_pass http://backend:8000;

        # SSE 需要 HTTP/1.1 且不能有 Connection: close
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ============================================================
        # SSE 三件套 —— 缺一个都可能让进度推送变成"攒够了一次性吐出"。
        #
        # 症状：界面上进度条长时间不动，然后突然跳到 100%。
        # 排查方法：curl -N http://localhost/api/v1/tasks/stream
        #          事件逐条出现 = 正常；卡住后一次性刷出 = 被缓冲了。
        # ============================================================
        proxy_buffering off;                 # 主开关
        proxy_cache off;                     # 禁止缓存
        proxy_set_header X-Accel-Buffering no;  # 兜底：有些配置下 buffering 会被上层继承覆盖

        # 默认 60 秒会掐断长连接，表现为"每 60 秒断一次然后重连"。
        # 必须大于后端的 SSE 心跳间隔（默认 15 秒）。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # 带内容哈希的构建产物：可以放心长缓存
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # index.html **绝不能长缓存**。
    #
    # 它引用的是带哈希的 assets 文件名。缓存了旧 HTML 之后，
    # 发版时旧 HTML 会去请求已经被删掉的旧 assets，用户看到白屏，
    # 必须手动强刷才能恢复——这是最难向用户解释的一类问题。
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        etag off;
    }

    # ------------------------------------------------------------------
    # SPA fallback
    #
    # 路由用的是 history 模式，直接访问 /tasks/xxx 或刷新页面时，
    # 服务器上并不存在这个文件。不加这一条就会 404。
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
