# ============================================================================
# smart-doc-parser 一键部署
#
#   docker compose up -d --build
#
# 三个服务：db（PostgreSQL）→ backend（FastAPI）→ frontend（nginx + 静态资源）
# 配置来源：仓库根目录的 .env（唯一事实来源）
# 本地开发用 docker-compose.dev.yml 叠加，见 Makefile 的 make dev-db
# ============================================================================
name: smart-doc-parser

services:
  # --------------------------------------------------------------------------
  # PostgreSQL
  # 使用 pgvector 镜像：阶段一用不到向量能力，但阶段二做 RAG 时同一个库
  # 直接 CREATE EXTENSION vector 即可，不必换镜像、迁数据。
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: sdp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 额外的自定义变量，供下面的初始化脚本读取
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-smart_doc_parser_test}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      # $$ 是 compose 的转义写法，必须写两个美元符。
      # 写成单个 $ 的话，compose 会在解析阶段就把它替换成宿主机的环境变量
      # （通常是空值），健康检查于是永远失败，且报错信息完全指不到这里。
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [sdp]

  # --------------------------------------------------------------------------
  # 后端 API
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-doc-parser-backend:latest
    container_name: sdp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器里的 localhost 指向容器自身。这里覆盖 .env 中的 localhost 为服务名，
      # 是「本地与线上配置统一」方案里唯一的一处环境差异。
      POSTGRES_HOST: db
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      db:
        # 等健康检查通过再启动，否则迁移会连不上数据库
        condition: service_healthy
    volumes:
      # 必须用 named volume 而不是 bind mount：
      # Linux 上 bind mount 不会继承镜像里的目录属主，非 root 进程（uid 1001）
      # 会因为没权限而写不进去；macOS 的 Docker Desktop 会自动映射属主，
      # 本地看着一切正常，一上服务器就 Permission denied。
      - uploads:/app/data/uploads
    ports:
      # 对外暴露后端端口便于直接访问 Swagger (/docs) 与调试。
      # 生产环境若无此需要，可删掉这段，只让 nginx 内网访问。
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/live", timeout=3) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 6
      # 首次启动要等数据库就绪 + 跑迁移，给足冷启动时间
      start_period: 40s
    networks: [sdp]

  # --------------------------------------------------------------------------
  # 前端（nginx：托管静态资源 + 反向代理 /api）
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: smart-doc-parser-frontend:latest
    container_name: sdp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [sdp]

networks:
  sdp:
    driver: bridge

volumes:
  pgdata:
    name: smart-doc-parser-pgdata
  uploads:
    name: smart-doc-parser-uploads
