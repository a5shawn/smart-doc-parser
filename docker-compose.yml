# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/compose-spec/compose-go@master/schema/compose-spec.json
# ============================================================================
# smart-doc-parser 一键部署
#
#   docker compose up -d --build
#
# 三个服务：db（PostgreSQL）→ backend（FastAPI）→ frontend（nginx + 静态资源）
# 配置来源：仓库根目录的 .env（唯一事实来源）
# 本地开发用 docker-compose.dev.yml 叠加，见 Makefile 的 make dev-db
# ----------------------------------------------------------------------------
# 上面第一行是给编辑器看的：告诉 YAML 扩展去哪里取校验用的 schema。
#
# 为什么用 jsdelivr 而不是官方地址：vscode-yaml 扩展把 docker-compose*.yml
# 内置映射到 raw.githubusercontent.com 上的 compose 规范，而那个域名在国内
# 通常不可达——表现为打开这个文件时一直报 "Unable to load schema"。
# 首行的 modeline 指令优先级最高，会覆盖扩展的内置映射。
#
# 官方地址（网络可达时可用）：
#   https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
# jsdelivr 的备用节点（主节点不通时换一个）：
#   https://fastly.jsdelivr.net/gh/compose-spec/compose-go@master/schema/compose-spec.json
#   https://gcore.jsdelivr.net/gh/compose-spec/compose-go@master/schema/compose-spec.json
#
# 注：这一行只是 YAML 注释，docker compose 会直接忽略，不影响任何运行行为。
# ============================================================================
name: smart-doc-parser

services:
  # --------------------------------------------------------------------------
  # PostgreSQL
  # 使用 pgvector 镜像：阶段一用不到向量能力，但阶段二做 RAG 时同一个库
  # 直接 CREATE EXTENSION vector 即可，不必换镜像、迁数据。
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: sdp-db
    restart: unless-stopped
    environment:
      # 注意：db 服务没有 env_file，完全靠这里的插值取配置。
      # 插值的来源是 compose 的 --env-file（默认 ./.env），
      # 所以切生产时**必须**通过 --env-file 把覆盖层带上，
      # 否则数据库会拿基线的开发密码启动。见 Makefile 的 COMPOSE_PROD。
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # 额外的自定义变量，供下面的初始化脚本读取
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-smart_doc_parser_test}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      # $$ 是 compose 的转义写法，必须写两个美元符。
      # 写成单个 $ 的话，compose 会在解析阶段就把它替换成宿主机的环境变量
      # （通常是空值），健康检查于是永远失败，且报错信息完全指不到这里。
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [sdp]

  # --------------------------------------------------------------------------
  # 后端 API
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-doc-parser-backend:latest
    container_name: sdp-backend
    restart: unless-stopped
    env_file:
      # 基线 + 环境覆盖层，后者只需写与基线不同的键，同名键以后者为准。
      # 覆盖层的文件名由 APP_ENV 决定，而 APP_ENV 来自 compose 的 --env-file
      # （见 Makefile 的 COMPOSE 与 COMPOSE_PROD）。
      # required: false 是为了让 development 不必专门建一个空文件——
      # 缺文件时静默跳过，而不是报 "env file not found" 拒绝启动。
      - .env
      - path: .env.${APP_ENV:-development}
        required: false
    environment:
      # 容器里的 localhost 指向容器自身。这里覆盖 .env 中的 localhost 为服务名，
      # 是「本地与线上配置统一」方案里唯一的一处环境差异。
      POSTGRES_HOST: db
      UPLOAD_DIR: /app/data/uploads
      # 必须显式注入，不能只靠上面的 env_file：后端要在**解析 .env 之前**
      # 就决定读哪个覆盖文件（否则是鸡生蛋），依据只能是进程环境变量。
      # 它的值来自 compose 插值，也就是 --env-file 的解析结果。
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        # 等健康检查通过再启动，否则迁移会连不上数据库
        condition: service_healthy
    volumes:
      # 必须用 named volume 而不是 bind mount：
      # Linux 上 bind mount 不会继承镜像里的目录属主，非 root 进程（uid 1001）
      # 会因为没权限而写不进去；macOS 的 Docker Desktop 会自动映射属主，
      # 本地看着一切正常，一上服务器就 Permission denied。
      - uploads:/app/data/uploads
    ports:
      # 对外暴露后端端口便于直接访问 Swagger (/docs) 与调试。
      # 生产环境若无此需要，可删掉这段，只让 nginx 内网访问。
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/live", timeout=3) as r:
                  sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 6
      # 首次启动要等数据库就绪 + 跑迁移，给足冷启动时间
      start_period: 40s
    networks: [sdp]

  # --------------------------------------------------------------------------
  # 前端（nginx：托管静态资源 + 反向代理 /api）
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: smart-doc-parser-frontend:latest
    container_name: sdp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [sdp]

networks:
  sdp:
    driver: bridge

volumes:
  pgdata:
    name: smart-doc-parser-pgdata
  uploads:
    name: smart-doc-parser-uploads
